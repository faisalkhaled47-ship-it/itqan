<style>

/* Layout: a lab-notebook study console. Sticky header with a tab row over one centred column (max 1080px)
   of ruled panels on a faint graph-paper ground. Mastery is read on a universal-indicator (pH) colour scale. */
:root{
  --ground:#F2F6F5; --grid:rgba(18,60,66,.055);
  --panel:#FFFFFF; --panel-2:#F5F9F8; --panel-3:#EAF2F1;
  --ink:#13232B; --ink-2:#465961; --ink-3:#74868C; --rule:#D6E2E0;
  --accent:#0A6A72; --accent-2:#0E8A90; --accent-soft:#DDF0EE; --on-accent:#FFFFFF;
  --marker:#FFEE9A; --marker-ink:#13232B; --star:#B7791F;
  --good:#1C7F4F; --good-soft:#E1F3E8; --bad:#BE3A33; --bad-soft:#FBE6E3; --warn:#9A6200; --warn-soft:#FBF0D9;
  --ph0:#A9B5B8; --ph1:#D2443D; --ph2:#E2862C; --ph3:#C7AE1F; --ph4:#3E9B57; --ph5:#2C68D0;
  --shadow:0 1px 2px rgba(19,35,43,.05), 0 6px 18px rgba(19,35,43,.05);
  --r:14px; --r-sm:10px;
  --f-display:"thmanyah sans",-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --f-body:"thmanyah sans",-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --f-fx:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1315; --grid:rgba(150,210,210,.045);
    --panel:#131C1F; --panel-2:#172226; --panel-3:#1C2A2E;
    --ink:#E3ECEB; --ink-2:#A8B8BB; --ink-3:#7D8F94; --rule:#25353A;
    --accent:#4CC4C8; --accent-2:#78D6D8; --accent-soft:#143539; --on-accent:#05191B;
    --marker:#4A4216; --marker-ink:#FFF3B8; --star:#E8B04B;
    --good:#53C48D; --good-soft:#11301F; --bad:#F0736A; --bad-soft:#3A1816; --warn:#E5A940; --warn-soft:#33270E;
    --ph0:#53636A; --ph1:#E35C54; --ph2:#EE9A45; --ph3:#D8C43E; --ph4:#5BBE70; --ph5:#5F95F2;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1315; --grid:rgba(150,210,210,.045);
  --panel:#131C1F; --panel-2:#172226; --panel-3:#1C2A2E;
  --ink:#E3ECEB; --ink-2:#A8B8BB; --ink-3:#7D8F94; --rule:#25353A;
  --accent:#4CC4C8; --accent-2:#78D6D8; --accent-soft:#143539; --on-accent:#05191B;
  --marker:#4A4216; --marker-ink:#FFF3B8; --star:#E8B04B;
  --good:#53C48D; --good-soft:#11301F; --bad:#F0736A; --bad-soft:#3A1816; --warn:#E5A940; --warn-soft:#33270E;
  --ph0:#53636A; --ph1:#E35C54; --ph2:#EE9A45; --ph3:#D8C43E; --ph4:#5BBE70; --ph5:#5F95F2;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{
  background-color:var(--ground); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  font-family:var(--f-body); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.6vw,28px);line-height:1.35}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.4}
h3{font-weight:700;font-size:16px;line-height:1.5}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)} .small{font-size:13px} .center{text-align:center}
kbd{font:600 11px/1 var(--f-body);border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.65;margin-inline-start:6px}
.fx{font-family:var(--f-fx);font-size:1.06em;unicode-bidi:isolate;direction:ltr;white-space:normal;overflow-wrap:anywhere;letter-spacing:.01em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule)}
@supports (background:color-mix(in srgb,red 50%,blue)){header.top{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px)}}
.top-in,.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--rule);background:var(--panel-2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pill b{font-family:var(--f-display);color:var(--accent);font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:2px 0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 14px 10px;font-weight:600;font-size:14.5px;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.wrap{padding-block:20px 72px}

/* generic */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel>h2{margin-bottom:12px}
.stack{display:grid;gap:16px}
.page-head{display:grid;gap:6px;margin-bottom:16px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.actions.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14.5px;cursor:pointer;text-align:center;line-height:1.35}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
:is(.btn,.link,.tab,.stab,.opt,.urow,.grow,.chipbtn,.pal-b,.fcard,summary,input,select):focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.field{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{min-height:42px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel-2);padding:6px 10px;font-weight:500;color:var(--ink);font-size:15px;min-width:0}
.field.inline{grid-auto-flow:column;align-items:center;justify-content:start;gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--rule);background:var(--panel-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* mastery: universal-indicator scale */
.mchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px 3px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink-2)}
.mchip i{width:10px;height:10px;border-radius:3px;background:var(--b,var(--ph0));flex:none}
.mchip.lg{font-size:14px;padding:5px 12px}
.phbar{position:relative;height:10px;border-radius:6px;background:var(--panel-3);overflow:visible;min-width:60px}
.phbar>b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:var(--b,var(--ph0))}
.phbar>u{position:absolute;inset-block:-4px;inset-inline-start:80%;width:2px;background:var(--ink-3);border-radius:2px;opacity:.7}
.phbar.lg{height:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--b)}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--b,var(--ph0));border:1px solid rgba(0,0,0,.06)}

/* home */
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.home{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.home .span{grid-column:1/-1}}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hero-main{display:grid;gap:6px;min-width:0}
.big{font-family:var(--f-display);font-weight:900;font-size:1.45em;color:var(--accent)}
.big.good{color:var(--good)} .big.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel-2);padding:10px 12px;display:grid;gap:2px}
.tile-n{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile-l{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.today-plan{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.m-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.m-total{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.groups{display:grid;gap:4px;margin-top:14px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,140px) 44px;align-items:center;gap:12px;border:0;background:none;padding:8px 6px;border-radius:8px;text-align:start;cursor:pointer;width:100%}
.grow:hover{background:var(--panel-2)}
.g-name{font-weight:600;line-height:1.35}
.g-name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.g-pct{font-variant-numeric:tabular-nums;font-weight:700;text-align:end}
.stats-line{margin-top:12px;font-size:13px;color:var(--ink-2)}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:8px}
.steps li::marker{font-family:var(--f-display);color:var(--accent);font-weight:600}
.sync{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ph0);margin-inline-end:6px}
.sync.on i{background:var(--good)}
.sync.off{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 14px;color:var(--ink);font-size:14px}
.sync.off i{background:var(--warn)}
.sync-line{min-width:0;flex:1 1 260px}
.syncpill{cursor:pointer;font-family:inherit}
.syncpill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ph0)}
.syncpill.on i{background:var(--good)} .syncpill.off{border-color:var(--warn);color:var(--warn)} .syncpill.off i{background:var(--warn)}

/* units list */
.search{display:block;margin-top:6px}
.search input{width:100%;min-height:46px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel);padding:8px 14px;font-size:15px}
.group{margin-top:22px}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.ulist{display:grid;gap:8px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;text-align:start;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer}
.urow:hover{border-color:var(--accent)}
.u-title{display:block;font-weight:700;font-size:15.5px;line-height:1.45}
.u-std{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.u-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.u-inds{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:150px}
.res-h{margin:18px 0 8px}
.res{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;display:grid;gap:4px}
.res .from{font-size:12px;color:var(--ink-3)}

/* unit */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);margin-bottom:8px}
.crumbs .link{font-weight:600}
.u-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.u-head>div:first-child{display:grid;gap:4px;min-width:0;flex:1 1 420px}
.std{font-size:14.5px;color:var(--ink-2)}
.inds{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inds li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.i-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600}
.i-body{display:grid;gap:4px;min-width:0}
.i-note{font-size:12.5px;color:var(--warn)}
.i-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:18px 0 14px;border-bottom:1px solid var(--rule)}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:none;border:0;background:none;padding:8px 12px;font-weight:600;font-size:14.5px;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer}
.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.callout{border:1px solid var(--rule);border-inline-start:4px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px}
.callout h3{font-size:14.5px;margin-bottom:4px}
.callout ul{margin:0;padding-inline-start:18px}
.sec{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;min-width:0}
.sec h3{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
.itags{display:inline-flex;gap:4px}
.itag{font:600 11.5px/1 var(--f-body);padding:4px 6px;border-radius:6px;background:var(--panel-3);color:var(--ink-2);cursor:help}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:78ch}
.pts li{position:relative;padding-inline-start:20px;overflow-wrap:anywhere}
.pts li::before{content:"";position:absolute;inset-inline-start:5px;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.pts li.st::before{content:"★";width:auto;height:auto;background:none;top:0;inset-inline-start:0;color:var(--star);font-size:13px}
.hl{background:linear-gradient(transparent 52%,var(--marker) 52%);color:var(--marker-ink);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding-inline:1px}
.pts.traps li::before{content:"!";width:auto;height:auto;background:none;top:0;color:var(--bad);font-weight:700}
.tbl-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--rule);border-radius:var(--r-sm)}
.tbl-t{font-weight:700;font-size:13.5px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:start;vertical-align:top}
th{background:var(--panel-2);font-weight:700;font-size:13px;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
.fx-list{display:grid;gap:8px}
.fx-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 16px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--rule)}
.fx-row:last-child{border-bottom:0}
.fx-n{font-weight:600;font-size:14px}
.fx-big{font-size:1.18em;text-align:start;justify-self:start}
.fx-v{grid-column:2;font-size:13px;color:var(--ink-2)}
@media (max-width:560px){.fx-row{grid-template-columns:minmax(0,1fr)}.fx-v{grid-column:1}}
details.notes{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--warn-soft);padding:10px 14px}
details.notes summary{cursor:pointer;font-weight:700;color:var(--warn)}
details.notes ul{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px}

/* concept maps */
.cmap{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.cm-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cm-root{width:fit-content;max-width:100%;margin:0 auto;padding:9px 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:600;font-size:17px;text-align:center;line-height:1.45}
.cm-stem{width:2px;height:16px;background:var(--rule);margin:0 auto}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;border-top:2px solid var(--rule);padding-top:16px}
.cm-b{position:relative;border:1px solid var(--rule);border-radius:12px;background:var(--panel-2);padding:10px 12px;min-width:0}
.cm-b::before{content:"";position:absolute;top:-17px;inset-inline-start:50%;width:2px;height:16px;background:var(--rule)}
.cm-l{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-3);border:1px dashed var(--rule);background:var(--panel);border-radius:999px;padding:0 8px;line-height:1.7;margin-inline-end:4px}
.cm-n{font-weight:600;overflow-wrap:anywhere}
.cm-n.lv1{display:block;margin-top:4px;font-family:var(--f-display);font-size:15.5px;color:var(--accent)}
.cm-kids{list-style:none;margin:8px 0 0;padding:0;padding-inline-start:14px;border-inline-start:2px solid var(--rule);display:grid;gap:6px}
.cm-kids li{position:relative;line-height:1.6}
.cm-kids li::before{content:"";position:absolute;inset-inline-start:-14px;top:.85em;width:10px;border-top:2px solid var(--rule)}
.cmap.quiz .cm-n:not(.shown){color:transparent;background:var(--panel-3);border-radius:6px;cursor:pointer;outline:1px dashed var(--rule)}
.cmap.quiz .cm-n:not(.shown) *{color:transparent}
.cmap.quiz .cm-n.lv1:not(.shown){background:var(--accent-soft)}

/* cards */
.clist{display:grid;gap:8px;margin-top:14px}
.citem{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel);padding:10px 14px}
.citem summary{cursor:pointer;font-weight:600;list-style-position:inside}
.c-a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);color:var(--ink-2)}
.dots{display:inline-flex;gap:2px;margin-inline-start:8px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--panel-3);border:1px solid var(--rule)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prog{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin-bottom:16px}
.prog>b{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.fcard{display:grid;align-content:center;gap:14px;min-height:280px;max-width:760px;margin:0 auto;padding:24px 22px;border-radius:18px;border:1px solid var(--rule);background:var(--panel);box-shadow:var(--shadow);text-align:center;cursor:pointer}
.fcard.flipped{cursor:default;border-color:var(--accent)}
.fc-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3);text-align:start}
.fc-meta .new{color:var(--accent);font-weight:700}
.fc-q{font-size:clamp(18px,3.6vw,22px);font-weight:600;line-height:1.75}
.fc-a{font-size:clamp(16.5px,3.2vw,19px);line-height:1.8;color:var(--ink)}
.fcard hr{border:0;border-top:1px dashed var(--rule);margin:0}
.fc-hint{font-size:13px;color:var(--ink-3)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px;margin:16px auto 8px}
.rate .btn{border-width:1px}
.rate-1{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.rate-2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.rate-3{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}

/* quiz */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
fieldset.field{border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 12px;margin:0;display:grid;gap:6px}
fieldset.field legend{padding:0 4px}
fieldset.field label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px}
fieldset.field input{accent-color:var(--accent);width:17px;height:17px}
.qcard{max-width:820px;margin:0 auto;display:grid;gap:14px}
.q-meta{font-size:12.5px;color:var(--ink-3)}
.q-text{font-family:var(--f-body);font-weight:600;font-size:clamp(17px,3.4vw,20px);line-height:1.8}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:start;padding:11px 14px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel);cursor:pointer;line-height:1.7;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .lt{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);font-weight:700;font-size:14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .lt{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .lt{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.explain{border-radius:var(--r-sm);padding:12px 14px;border:1px solid var(--rule);display:grid;gap:6px}
.explain.ok{background:var(--good-soft);border-color:var(--good-soft)}
.explain.no{background:var(--bad-soft);border-color:var(--bad-soft)}
.timer{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer.low{color:var(--bad)}
.score{font-weight:700;color:var(--good)}
details.palette{max-width:820px;margin:16px auto 0}
details.palette summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.pal-b{min-height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.pal-b.a{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.pal-b.cur{outline:2px solid var(--accent)}
.result{display:grid;gap:10px}
.byg{display:grid;gap:6px;margin-top:6px}
.bg-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:14px}
.bg-row span:last-child{text-align:end;font-variant-numeric:tabular-nums}
.witem{border-top:1px dashed var(--rule);padding:12px 0;display:grid;gap:4px}
.witem:first-of-type{border-top:0}
.ans-ok{color:var(--good);font-weight:600} .ans-no{color:var(--bad);font-weight:600}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:14px}

/* plan */
.plan{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.pday{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r-sm);padding:12px 14px}
.pday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pday.done{opacity:.6}
.pday input{width:20px;height:20px;accent-color:var(--accent);margin-top:4px}
.pdate{font-weight:700;font-size:14px;color:var(--ink-2)}
.ptag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-inline-start:6px;background:var(--panel-3);color:var(--ink-2)}
.ptag.learn{background:var(--accent-soft);color:var(--accent)}
.ptag.exam{background:var(--warn-soft);color:var(--warn)}

/* toast & modal */
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,18,20,.5);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:20px;max-width:420px;width:100%;display:grid;gap:10px}
/* figure palette: soft fills k1..k6, strong strokes s1..s6, strong fills (text/marks) x1..x6 */
:root{
  --k1:#D3EEEC; --k2:#FCE9C2; --k3:#F9D9D6; --k4:#D9E6FB; --k5:#D8F0DD; --k6:#E7DDF7;
  --s1:#0A6A72; --s2:#9A6200; --s3:#B8382F; --s4:#2C5FC0; --s5:#237A3E; --s6:#6A43B5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --k1:#12393C; --k2:#3D2F10; --k3:#42201D; --k4:#1A2C4D; --k5:#173A24; --k6:#2D2348;
    --s1:#5BCBCE; --s2:#E8B04B; --s3:#F07B72; --s4:#7AA7F5; --s5:#63C77F; --s6:#B39AF0;
  }
}
:root[data-theme="dark"]{
  --k1:#12393C; --k2:#3D2F10; --k3:#42201D; --k4:#1A2C4D; --k5:#173A24; --k6:#2D2348;
  --s1:#5BCBCE; --s2:#E8B04B; --s3:#F07B72; --s4:#7AA7F5; --s5:#63C77F; --s6:#B39AF0;
}
.fig{margin:12px 0 4px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel);padding:10px 10px 8px}
.fig svg{display:block;width:100%;height:auto;max-width:680px;margin:0 auto;font-family:var(--f-body);overflow:visible}
.fig svg text{font-family:var(--f-body)}
.fig svg .fxt{font-family:var(--f-fx)}
.fig svg .bold{font-weight:700}
.fig .k1{fill:var(--k1)} .fig .k2{fill:var(--k2)} .fig .k3{fill:var(--k3)} .fig .k4{fill:var(--k4)} .fig .k5{fill:var(--k5)} .fig .k6{fill:var(--k6)}
.fig .s1{stroke:var(--s1)} .fig .s2{stroke:var(--s2)} .fig .s3{stroke:var(--s3)} .fig .s4{stroke:var(--s4)} .fig .s5{stroke:var(--s5)} .fig .s6{stroke:var(--s6)}
.fig .x1{fill:var(--s1)} .fig .x2{fill:var(--s2)} .fig .x3{fill:var(--s3)} .fig .x4{fill:var(--s4)} .fig .x5{fill:var(--s5)} .fig .x6{fill:var(--s6)}
.fig .ink{fill:var(--ink)} .fig .ink2{fill:var(--ink-2)} .fig .mut{fill:var(--ink-3)}
.fig .lin{stroke:var(--ink-2)} .fig .lmut{stroke:var(--rule)} .fig .lacc{stroke:var(--accent)}
.fig .pap{fill:var(--panel)} .fig .pap2{fill:var(--panel-2)} .fig .pap3{fill:var(--panel-3)} .fig .acc{fill:var(--accent)}
.fig .nof{fill:none}
.fig figcaption{font-size:13px;color:var(--ink-2);text-align:center;margin-top:6px;line-height:1.6}

/* indicator explanations */
.xcard{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;max-width:860px;scroll-margin-top:120px}
.x-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;margin-bottom:10px}
.x-ind{font-weight:700;line-height:1.6}
.x-idea{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;line-height:1.8}
.x-body{display:grid;gap:10px;margin-top:12px;max-width:78ch}
.x-box{border-radius:var(--r-sm);padding:10px 14px;margin-top:12px;border:1px solid var(--rule)}
.x-box>b{display:block;margin-bottom:4px}
.x-box.ex{background:var(--panel-2)}
.x-box.pit{background:var(--warn-soft);border-color:var(--warn-soft)}
.x-box.pit>b{color:var(--warn)}
.x-steps{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:4px}
@media (max-width:560px){.xcard{padding:14px}.x-head{grid-template-columns:30px minmax(0,1fr)}.x-head .mchip{grid-column:2;justify-self:start}}

/* ================= skin «pro» (data-skin="pro" on <html>), after مصروفي ================= */
.ptitle,.cstrip{display:none}
.tabs-in{display:contents}
.tab svg{display:none}
html[data-skin=pro]{
  --ground:#F2F3F1; --grid:transparent; --panel:#FFFFFF; --panel-2:#F2F4F2; --panel-3:#E7EBE8; --rule:rgba(16,24,20,.09);
  --ink:#101814; --ink-2:#4A544F; --ink-3:#89928D; --shadow:none; --r:20px; --r-sm:14px;
  --f-num:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
  --tb-bg:rgba(21,33,28,.93); --tb-ink:rgba(255,255,255,.62); --tb-on:#FFFFFF; --tb-shadow:0 12px 32px rgba(16,24,20,.3),inset 0 1px 0 rgba(255,255,255,.08);
}
@media (prefers-color-scheme: dark){ html[data-skin=pro]:not([data-theme="light"]){
  --ground:#2E3137; --panel:#3A3E45; --panel-2:#454950; --panel-3:#50555D; --rule:rgba(255,255,255,.09);
  --ink:#F3F4F6; --ink-2:#CDD0D6; --ink-3:#AAAFB8; --accent-soft:#2F5052; --marker:#5A4E1F;
  --good-soft:#33554A; --warn-soft:#5E4630; --bad-soft:#613A3A;
  --tb-bg:rgba(88,93,102,.94); --tb-ink:rgba(255,255,255,.68); --tb-on:var(--on-accent); --tb-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1) } }
html[data-skin=pro][data-theme="dark"]{
  --ground:#2E3137; --panel:#3A3E45; --panel-2:#454950; --panel-3:#50555D; --rule:rgba(255,255,255,.09);
  --ink:#F3F4F6; --ink-2:#CDD0D6; --ink-3:#AAAFB8; --accent-soft:#2F5052; --marker:#5A4E1F;
  --good-soft:#33554A; --warn-soft:#5E4630; --bad-soft:#613A3A;
  --tb-bg:rgba(88,93,102,.94); --tb-ink:rgba(255,255,255,.68); --tb-on:var(--on-accent); --tb-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
html[data-skin=pro] body{background-image:none;font-size:16px}
html[data-skin=pro] body::before{background:var(--ground)}
html[data-skin=pro] .num,html[data-skin=pro] .tile-n,html[data-skin=pro] .m-total,html[data-skin=pro] .g-pct,html[data-skin=pro] .timer{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* header: large page title, round buttons, progress strip */
html[data-skin=pro] header.top{position:relative;top:auto;background:var(--ground);border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none}
html[data-skin=pro] .top-in{max-width:620px;padding-block:12px 0;align-items:center}
html[data-skin=pro] .nav-row{display:none}
html[data-skin=pro] .brand-ico,html[data-skin=pro] .brand b{display:none}
html[data-skin=pro] .ptitle{display:block;margin:0;font-family:var(--f-display);font-weight:800;font-size:31px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
html[data-skin=pro] header.slim .ptitle{display:none}
html[data-skin=pro] header.slim .top-in{padding-block:10px 0}
html[data-skin=pro] .icon-btn{appearance:none;border:0;background:var(--panel);width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
html[data-skin=pro] .modal.as-sheet{padding:0;place-items:end center}
html[data-skin=pro] .modal.as-sheet .modal-card.sheet{border-radius:24px 24px 0 0;max-width:620px;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--panel)}
html[data-skin=pro] .icon-btn svg{width:20px;height:20px}
html[data-skin=pro] .icon-btn.on{background:var(--accent);color:var(--on-accent)}
html[data-skin=pro] .cstrip{display:block;max-width:620px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px))}
html[data-skin=pro] .cstrip:empty{display:none}
.cs-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-2)}
.cs-name{font-weight:600;color:var(--ink)} .cs-name b{color:var(--accent);font-size:15px}
.cs-left b{font-family:var(--f-num);color:var(--ink)}
.cs-left .link{font-size:13.5px}
.cs-track{position:relative;height:6px;border-radius:999px;background:var(--rule);margin-top:8px}
.cs-track i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:999px;background:var(--b,var(--accent))}
.cs-track u{position:absolute;top:-3px;bottom:-3px;inset-inline-start:80%;width:2px;border-radius:2px;background:var(--ink-3)}
/* floating capsule tab bar */
html[data-skin=pro] nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:block;overflow:visible;background:transparent;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
html[data-skin=pro] .tabs-in{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto;padding:5px;border-radius:999px;background:var(--tb-bg);box-shadow:var(--tb-shadow);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
html[data-skin=pro] .tabs-in::before{content:"";position:absolute;top:5px;bottom:5px;width:calc((100% - 10px) / 5);inset-inline-start:calc(5px + (100% - 10px) / 5 * var(--i,0));border-radius:999px;background:var(--accent);transition:inset-inline-start .34s cubic-bezier(.3,.8,.2,1),opacity .2s}
html[data-skin=pro] .tabs-in.nopill::before{opacity:0}
html[data-skin=pro] .tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:999px;background:none;color:var(--tb-ink);font-size:10.5px;font-weight:600;padding:7px 0 6px;min-width:0;cursor:pointer;transition:color .2s,transform .12s}
html[data-skin=pro] .tab:hover{background:none;color:var(--tb-on)}
html[data-skin=pro] .tab:active{transform:scale(.93)}
html[data-skin=pro] .tab svg{display:block;width:24px;height:24px}
html[data-skin=pro] .tab.on{color:var(--tb-on);border:0}
html[data-skin=pro] .tab.on svg{fill:currentColor;fill-opacity:.22;stroke-width:2.1}
html[data-skin=pro] .tab span{white-space:nowrap}
html[data-skin=pro] .wrap{max-width:620px;padding-block:14px calc(108px + env(safe-area-inset-bottom,0px))}
html[data-skin=pro] .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:14px}
/* cards and headings */
html[data-skin=pro] .panel{border:0;border-radius:var(--r);padding:18px 16px;box-shadow:none}
html[data-skin=pro] .panel>h2,html[data-skin=pro] h2{font-size:18px;font-weight:700;letter-spacing:-.005em}
html[data-skin=pro] .page-head h1{display:none}
html[data-skin=pro] .page-head{margin-bottom:12px}
html[data-skin=pro] .home{gap:14px}
html[data-skin=pro] .home{grid-template-columns:minmax(0,1fr)}
html[data-skin=pro] .home .span{grid-column:auto}
html[data-skin=pro] .eyebrow{color:var(--ink-3);font-weight:600}
html[data-skin=pro] .hero h1{font-size:24px;font-weight:800}
html[data-skin=pro] .hero .big{font-family:var(--f-num);font-size:1.3em}
html[data-skin=pro] .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html[data-skin=pro] .tile{border:0;background:var(--panel-2);border-radius:16px;padding:12px;text-align:center}
html[data-skin=pro] .tile-n{font-size:26px;font-weight:700;letter-spacing:-.02em}
html[data-skin=pro] .tile-l{color:var(--ink-3);font-weight:600}
html[data-skin=pro] .m-total{font-size:34px;font-weight:700}
html[data-skin=pro] .grow{padding:10px 2px;border-radius:0;border-bottom:1px solid var(--rule)}
html[data-skin=pro] .grow:last-child{border-bottom:0}
html[data-skin=pro] .grow:hover{background:none}
html[data-skin=pro] .today-plan{border-top:1px solid var(--rule)}
/* buttons and fields */
html[data-skin=pro] .btn{border:0;border-radius:14px;min-height:46px;font-weight:700}
html[data-skin=pro] .btn.ghost{background:var(--panel-2);color:var(--ink)}

html[data-skin=pro] .actions .btn:not(.sm){flex:1 1 auto}
html[data-skin=pro] .field input,html[data-skin=pro] .field select,html[data-skin=pro] .search input,html[data-skin=pro] .field textarea{border:0!important;background:var(--panel-2)!important;border-radius:12px!important;min-height:46px}
html[data-skin=pro] .search input{background:var(--panel)!important}
html[data-skin=pro] fieldset.field{border:0;background:var(--panel-2);border-radius:14px;padding:10px 14px}
html[data-skin=pro] .chipbtn{border:0;background:var(--panel-2)}
html[data-skin=pro] .pill{border:0;background:var(--panel)}
html[data-skin=pro] .mchip{border:0;background:var(--panel-2)}
html[data-skin=pro] .sync{font-size:13px}
html[data-skin=pro] .sync.off{border:0;border-radius:16px;padding:12px 14px}
html[data-skin=pro] .hint{border:0;border-radius:14px}

html[data-skin=pro] .x-idea,html[data-skin=pro] .x-box,html[data-skin=pro] .callout{border:0;border-radius:14px}
html[data-skin=pro] .x-req{border:0;border-radius:14px;background:var(--panel-2)}

html[data-skin=pro] .cm-b{border:0;border-radius:14px}
/* cards & quiz */
html[data-skin=pro] .fcard{border:0;border-radius:24px}

html[data-skin=pro] .rate .btn{min-height:52px}
html[data-skin=pro] .citem{border:0;border-radius:14px}
html[data-skin=pro] .opt{border:0;border-radius:16px;background:var(--panel);padding:13px 14px;box-shadow:inset 0 0 0 1.5px transparent}
html[data-skin=pro] .opt .lt{background:var(--panel-2)}
html[data-skin=pro] .opt.sel{box-shadow:inset 0 0 0 2px var(--accent)}
html[data-skin=pro] .opt.right{box-shadow:inset 0 0 0 2px var(--good)}
html[data-skin=pro] .opt.wrong{box-shadow:inset 0 0 0 2px var(--bad)}
html[data-skin=pro] .explain{border:0;border-radius:16px}
html[data-skin=pro] .q-p{border-radius:0 14px 14px 0;background:var(--panel)}
html[data-skin=pro] .pal-b{border:0;background:var(--panel)}
html[data-skin=pro] .prog{background:var(--rule)}
/* plan */
html[data-skin=pro] .pday{border:0;border-radius:16px}
html[data-skin=pro] .pday.today{box-shadow:inset 0 0 0 2px var(--accent)}

/* iOS: date inputs have an intrinsic minimum width that can push their container sideways */
.field{min-width:0}

.top-btns{display:flex;gap:8px;flex:none}

.icon-btn svg{width:19px;height:19px}

.icon-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-3);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14.5px;padding:7px 6px;border-radius:9px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modal-card.sheet{max-width:520px;max-height:min(86vh,760px);overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;gap:0;padding-top:8px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 10px;position:sticky;top:-8px;background:var(--panel);z-index:1}
.set-sec{padding:14px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.set-sec h3{font-size:14px;color:var(--ink-2);font-weight:700}
.set-sec .field{display:block}
.set-sec .field input{width:100%}

.fig.img img{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:50;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.zoom img{display:block;max-width:none;margin:calc(60px + env(safe-area-inset-top,0px)) auto 30px;padding:0 12px}
.zoom-x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:51}
.q-p{margin:10px 0 0;padding:10px 14px;border-inline-start:3px solid var(--accent);background:var(--panel-2);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px;line-height:1.85}
.x-req p.small{margin-top:6px}
.x-req{border:1px dashed var(--rule);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;background:var(--panel-2)}

.x-req ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14.5px}
.x-h{font-size:15.5px;font-weight:800;color:var(--accent);margin:6px 0 -2px}
.x-ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.x-box>p+p{margin-top:8px}
.x-box .x-ul{margin-top:6px}
.x-box.note{background:var(--accent-soft);border-color:var(--accent-soft)}

.fig.img{background:#fff;padding:6px}
.fig.img img{display:block;width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:6px}

.sec .x-body{margin-top:10px}

.libpill svg{flex:none}
.libpill.on{border-color:var(--accent);color:var(--accent)}
.welcome{max-width:600px;margin:8px auto 0;display:grid;gap:12px}
.logo{width:60px;height:60px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

.packs{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.imp-res li{display:grid;gap:2px;border-inline-start:4px solid var(--good);padding:2px 10px}
.imp-res li.bad{border-color:var(--bad)}

.btn.ghost.danger{background:transparent;color:var(--bad);border-color:var(--rule)}
@media (max-width:360px){.tab{padding:8px 6px 9px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  body{font-size:15px}
  .panel{padding:14px}
  .sec{padding:14px}
  .brand small{display:none}
  .grow{grid-template-columns:minmax(0,1fr) 64px 40px;gap:8px}
  .urow{grid-template-columns:minmax(0,1fr)}

  .u-inds{justify-content:flex-start;max-width:none}
  .bg-row{grid-template-columns:minmax(0,1fr) 70px 46px}

  .rate .btn{padding:8px 6px;font-size:14px}

  .brand b{font-size:15px}
  #top-meta .mpill{display:none}
  .tab{padding:8px 9px 9px;font-size:14px}
  nav.tabs{justify-content:space-between}
}

  function countsLine(c) { return [n2(c.std, ['معيار واحد', 'معياران', 'معايير', 'معيارًا']), n2(c.ind, ['مؤشر واحد', 'مؤشران', 'مؤشرات', 'مؤشرًا']), c.cards ? n2(c.cards, ['بطاقة واحدة', 'بطاقتان', 'بطاقات', 'بطاقة']) : '', n2(c.q, ['سؤال واحد', 'سؤالان', 'أسئلة', 'سؤالًا'])].filter(Boolean).join(' · '); }
  function showModal(html) { modal.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true">' + html + '</div>'; modal.hidden = false; var b = modal.querySelector('.btn'); if (b) b.focus(); }
  function hideModal() { modal.hidden = true; modal.innerHTML = ''; }
  function done(ok, html) {
    showModal(html + '<div class="actions"><button class="btn" id="dev-done">' + (ok ? 'متابعة' : 'حسنًا') + '</button></div>');
    document.getElementById('dev-done').addEventListener('click', function () { if (ok) location.reload(); else hideModal(); });
  }
  function pick(accept, multiple) {
    return new Promise(function (res) {
      var inp = document.createElement('input'); inp.type = 'file'; if (accept) inp.accept = accept; inp.multiple = !!multiple;
      inp.style.cssText = 'position:fixed;top:-200px;left:0;opacity:0';
      document.body.appendChild(inp);
      inp.addEventListener('change', function () { var f = Array.prototype.slice.call(inp.files || []); inp.parentNode && inp.parentNode.removeChild(inp); if (f.length) res(f); });
      inp.click();
    });
  }
  function readBuf(f) { return f.arrayBuffer ? f.arrayBuffer() : new Response(f).arrayBuffer(); }
  var WHY = { nopack: 'لا يحتوي بيانات التطبيق. استخدم النسخة المحدّثة من ملفات إتقان.', format: 'صيغة البيانات في الملف غير صالحة.', quota: 'لا توجد مساحة كافية على الجهاز.', other: 'تعذّرت قراءة الملف.' };
  function pickPacks() {
    pick('.pdf,.json,application/pdf,application/json', true).then(function (files) {
      showModal('<h2>جارٍ قراءة الملفات…</h2><p class="muted small" id="dev-prog"></p>');
      var out = [];
      return files.reduce(function (pr, f, k) {
        return pr.then(function () {
          var pe = document.getElementById('dev-prog'); if (pe) pe.textContent = (k + 1) + ' من ' + files.length + ': ' + f.name;
          return readBuf(f).then(function (b) { return packFromBytes(new Uint8Array(b)); }).then(function (raw) {
            var p = validatePack(raw); p.added = Date.now();
            return put('packs', p).then(function () { out.push({ ok: true, t: p.title, c: p.counts }); });
          })['catch'](function (e) {
            var why = e && e.name === 'QuotaExceededError' ? 'quota' : e && WHY[e.message] ? e.message : 'other';
            out.push({ ok: false, t: f.name, why: why });
          });
        });
      }, Promise.resolve()).then(function () {
        var ok = out.filter(function (r) { return r.ok; }).length;
        if (ok && navigator.storage && navigator.storage.persist) navigator.storage.persist()['catch'](function () {});
        done(ok, '<h2>' + (ok ? (ok === out.length ? 'أُضيفت الملفات' : 'أُضيف ' + ok + ' من ' + out.length) : 'لم يُضف أي ملف') + '</h2><ul class="imp-res">' + out.map(function (r) {
          return '<li class="' + (r.ok ? 'ok' : 'bad') + '"><b>' + esc(r.t) + '</b><span class="small muted">' + (r.ok ? countsLine(r.c) : WHY[r.why]) + '</span></li>';
        }).join('') + '</ul>');
      });
    });
  }
  function fontWeight(name) {
    var n = String(name).toLowerCase();
    return /black|heavy/.test(n) ? 900 : /extra-?bold|ultra-?bold/.test(n) ? 800 : /semi-?bold|demi/.test(n) ? 600 : /bold/.test(n) ? 700 : /medium/.test(n) ? 500 : /extra-?light|ultra-?light|thin|hairline/.test(n) ? 200 : /light/.test(n) ? 300 : 400;
  }
  function applyFont(f) {
    try { var ff = new FontFace('thmanyah sans', f.data, { weight: String(f.weight), style: 'normal' }); return ff.load().then(function () { document.fonts.add(ff); }); }
    catch (e) { return Promise.reject(e); }
  }
  function pickFonts() {
    pick('', true).then(function (files) {
      showModal('<h2>جارٍ إضافة الخط…</h2>');
      var ok = 0, bad = 0;
      return files.reduce(function (pr, f) {
        return pr.then(function () {
          return readBuf(f).then(function (buf) {
            var rec = { id: 'w' + fontWeight(f.name), weight: fontWeight(f.name), name: f.name, data: buf };
            return applyFont(rec).then(function () { return put('fonts', rec); }).then(function () { ok++; });
          })['catch'](function () { bad++; });
        });
      }, Promise.resolve()).then(function () {
        done(ok, '<h2>' + (ok ? 'أُضيف الخط' : 'تعذّرت إضافة الخط') + '</h2><p class="muted">' + (bad ? (bad === 1 ? 'ملف واحد لم يُقبل' : bad + ' ملفات لم تُقبل') + ' لأنه ليس ملف خط صالحًا (OTF أو TTF أو WOFF).' : 'سيُستخدم داخل التطبيق على هذا الجهاز فقط.') + '</p>');
      });
    });
  }
  function saveFile(name, text) {
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.share) {
      var can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) {}
      if (can) return navigator.share({ files: [file], title: name }).then(function () { return 'shared'; }, function (e) { if (e && e.name === 'AbortError') return 'cancel'; return download(name, text); });
    }
    return Promise.resolve(download(name, text));
  }
  function download(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' })), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.parentNode && a.parentNode.removeChild(a); }, 4000);
    return 'download';
  }
  function welcome() {
    main.innerHTML = '<section class="panel welcome"><div class="logo">' + LOGO + '</div><h1>إتقان</h1>' +
      '<p>شروح ورسوم وخرائط مفاهيم وبطاقات وأسئلة وخطة مراجعة، تعمل على جهازك دون حساب ودون خادم.</p>' +
      '<p class="muted">التطبيق فارغ حتى تضيف ملفات إتقان: اختر ملف PDF أو أكثر من تطبيق «الملفات»، فيُقرأ محتواه ويُحفظ على هذا الجهاز فقط.</p>' +
      (STANDALONE ? '' : '<p class="hint">' + INSTALL + '</p>') +
      '<div class="actions"><button class="btn" id="w-add">أضف ملفات إتقان</button></div>' +
      '<ol class="steps small muted"><li>تُحفظ ملفاتك وتقدمك على هذا الجهاز وحده، ولا يُرفع شيء إلى أي مكان.</li><li>تستطيع إضافة ملف واحد الآن والباقي لاحقًا من زر «الملفات».</li><li>احفظ نسخة احتياطية من تقدمك بين حين وآخر من الزر نفسه.</li></ol></section>';
    document.getElementById('w-add').addEventListener('click', pickPacks);
  }
  function fail(msg) {
    main.innerHTML = '<section class="panel welcome"><h1>تعذّر فتح التخزين</h1><p class="muted">' + esc(msg) + '</p><p>إن كنت في وضع التصفح الخاص فافتح التطبيق في نافذة عادية أو من أيقونته على الشاشة الرئيسية.</p></section>';
  }
  var HOST = {
    device: true, packs: [], fonts: 0, standalone: STANDALONE, installText: INSTALL,
    lastBackup: function () { try { return +localStorage.getItem(BKEY) || 0; } catch (e) { return 0; } },
    markBackup: function () { try { localStorage.setItem(BKEY, String(Date.now())); } catch (e) {} },
    pickPacks: pickPacks, pickFonts: pickFonts, saveFile: saveFile,
    pickText: function (accept) { return pick(accept, false).then(function (f) { return f[0].text ? f[0].text() : new Response(f[0]).text(); }); },
    removePack: function (id) { del('packs', id).then(function () { location.reload(); }); },
    removeFonts: function () { clear('fonts').then(function () { location.reload(); }); },
    storage: function () {
      var S = navigator.storage || {};
      return Promise.all([S.persisted ? S.persisted()['catch'](function () { return null; }) : null, S.estimate ? S.estimate()['catch'](function () { return null; }) : null])
        .then(function (r) { return { persisted: r[0], usage: r[1] ? r[1].usage : null }; });
    },
    persist: function () { return navigator.storage && navigator.storage.persist ? navigator.storage.persist()['catch'](function () { return false; }) : Promise.resolve(false); },
    reset: function () {
      try { localStorage.removeItem(PKEY); localStorage.removeItem(BKEY); } catch (e) {}
      if (db) { db.close(); db = null; }
      var r = indexedDB.deleteDatabase(DBN); r.onsuccess = r.onerror = r.onblocked = function () { location.reload(); };
    }
  };
  idb().then(function () { return Promise.all([all('packs'), all('fonts')]); }).then(function (r) {
    var packs = r[0] || [], fonts = r[1] || [];
    fonts.forEach(function (f) { applyFont(f)['catch'](function () {}); });
    HOST.fonts = fonts.length;
    if (!packs.length) { welcome(); return; }
    HOST.packs = packs.map(function (p) { return { id: p.id, title: p.title, order: p.order, counts: p.counts, added: p.added, ver: p.ver }; }).sort(function (a, b) { return a.order - b.order; });
    startApp(merge(packs), null, HOST);
  })['catch'](function (e) { fail((e && (e.message || e.name)) || String(e)); });
}

/* ---------- launch ---------- */
if (window.ITQAN_DEVICE) deviceBoot();

})();
